name: TOP-3 auto update
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest Stoloto draw
        run: node scripts/update.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/archive.json data/latest.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "TOP-3 AUTO"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/archive.json data/latest.json
          git commit -m "data: update TOP-3 draw"
          git push
