<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>TOP-3 CHAT MASTER</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./top3-upgrade.css?v=121">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="./assets/icon.png" alt="" class="brand-icon">
        <div><b>TOP-3</b><span id="versionBadge">v1.2.1</span></div>
      </div>
      <button id="refreshBtn" class="primary">↻ Обновить</button>
      <div class="source-status"><span id="sourceDot" class="dot ok"></span><span id="sourceText">Столото: подключено</span></div>
      <button id="menuBtn" class="icon-btn" aria-label="Меню">☰</button>
    </header>

    <div class="shell">
      <nav id="sidebar" class="sidebar">
        <button data-page="home" class="nav active">⌂ Главная</button>
        <button data-page="forecasts" class="nav">◉ Прогноз</button>
        <button data-page="algorithm" class="nav">◎ Слежение</button>
        <button data-page="triples" class="nav">✦ Тройники</button>
        <button data-page="mirror" class="nav">↔ Зеркало</button>
        <button data-page="archive" class="nav">▣ Архив</button>
        <button data-page="stats" class="nav">▥ Статистика</button>
        <button data-page="settings" class="nav">⚙ Настройки</button>
      </nav>
      <main id="main" class="main"></main>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="./js/app.js?v=121"></script>
</body>
</html>
