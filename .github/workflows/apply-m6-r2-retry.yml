name: Apply M6-R2 retry

on:
  push:
    paths:
      - '.github/workflows/apply-m6-r2-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch script
        run: python3 scripts/apply_m6_r2_patch.py

      - name: Validate
        shell: bash
        run: |
          node --check js/engine/m6-r2.js
          node --check analyzer/app.js
          node --check analyzer/sw.js
          node --input-type=module - <<'NODE'
          import {computeM6R2,m6r2MirrorFamily} from './js/engine/m6-r2.js';
          const records=[
            {draw:100,combo:'068'},
            {draw:200,combo:'240'},
            {draw:400,combo:'680'},
            {draw:500,combo:'806'},
            {draw:530,combo:'402'},
            {draw:550,combo:'086'}
          ];
          const r=computeM6R2({records});
          if(m6r2MirrorFamily('086')!=='024')throw new Error('mirror_family test failed');
          if(!r.trigger||r.familyCount!==4||r.gap1!==300||r.gap3!==50||r.mirrorCount!==2||r.mirrorLag!==20||!r.signal.includes('666'))throw new Error('M6-R2 strict test failed: '+JSON.stringify(r));
          console.log('M6-R2 PASS',r.signal.join('/'));
          NODE
          grep -Fq 'M6 V3 + M6-R2' analyzer/index.html
          grep -Fq 'M6-R2: ${m6r2Forecast}' analyzer/app.js
          grep -Fq '../js/engine/m6-r2.js' analyzer/sw.js

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-m6-r2.yml .github/workflows/apply-m6-r2-retry.yml scripts/apply_m6_r2_patch.py
          git add analyzer/app.js analyzer/index.html analyzer/sw.js
          git commit -m 'M6: add experimental R2 filter and bracket forecast'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
