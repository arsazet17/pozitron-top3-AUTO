name: Sync Analyzer with Yulia core v4

on:
  push:
    paths:
      - 'patch-sync-analyzer-yulia-v4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Analyzer shared-core patch
        run: python3 patch-sync-analyzer-yulia-v4.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer/app.js analyzer/sw.js analyzer/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: Analyzer uses Yulia canonical forecast core"
            git push
          fi
