name: Apply M6 leaders 30

on:
  push:
    paths:
      - 'patch-m6-leaders30.py'
      - '.github/workflows/apply-m6-leaders30-v1310.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 patch-m6-leaders30.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/triples.js data/version.json sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 AUTO v1.3.10: M6 forecast leaders for last 30 draws"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
