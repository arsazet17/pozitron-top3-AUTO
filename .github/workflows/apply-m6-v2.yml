name: Apply M6 REPEAT-FAMILY-150 V2

on:
  push:
    paths:
      - 'patch-m6-auto.py'
      - 'js/engine/m6-repeat-family.js'
      - '.github/workflows/apply-m6-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M6 patch
        run: python3 patch-m6-auto.py
      - name: Commit M6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/triples.js js/engine/m6-repeat-family.js data/version.json sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 AUTO v1.3.9: add M6 REPEAT-FAMILY-150 V2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
