name: Sync Analyzer with Yulia core v2

on:
  push:
    paths:
      - 'patch-sync-analyzer-yulia-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sync patch
        run: node patch-sync-analyzer-yulia-v2.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer/app.js js/engine/triples-chat.js analyzer/sw.js analyzer/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: use one forecast core in Yulia and Analyzer"
            git push
          fi
