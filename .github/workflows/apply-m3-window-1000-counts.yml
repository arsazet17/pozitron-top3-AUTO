name: Restore M3 original 15-draw logic

on:
  push:
    paths:
      - '.github/workflows/apply-m3-window-1000-counts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top3-m3-restore15
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore M3 exactly as before
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label):
              if old not in s:
                  if new in s:
                      print(label, 'already restored')
                      return s
                  raise SystemExit(label + ': source not found')
              print(label, 'restored')
              return s.replace(old, new, 1)

          p=Path('js/engine/triples-yulia.js'); s=p.read_text(encoding='utf-8')
          s=rep(s,
              'export const TRIPLE_CHAT_RULE_CODE = "YULIA-TOP3-M1M2M3-CANONICAL-1.2.15-M3-1000";\nexport const M3_WINDOW = 1000;\nexport const TRIPLE_CHAT_SEED_ID = 267958;',
              'export const TRIPLE_CHAT_RULE_CODE = "YULIA-TOP3-M1M2M3-CANONICAL-1.2.14";\nexport const TRIPLE_CHAT_SEED_ID = 267958;',
              'engine version')
          s=rep(s,
              'const older=allReal.filter(d=>d.id<current.id),idxMap=new Map(allReal.map((d,i)=>[d.id,i])),previousM3=older.slice(-M3_WINDOW);',
              'const older=allReal.filter(d=>d.id<current.id),idxMap=new Map(allReal.map((d,i)=>[d.id,i])),previous15=older.slice(-15);',
              'M3 window')
          s=rep(s,
              'const diag={blocks:[],raw:[],packages:[],dependency:[],mirror:"",mirrorPass:false,mirrorHits:0,m2Events:[],seriesEvents:[],serialEvents:[],m3Window:M3_WINDOW,m3CollapseCounts:{}};',
              'const diag={blocks:[],raw:[],packages:[],dependency:[],mirror:"",mirrorPass:false,mirrorHits:0,m2Events:[],seriesEvents:[],serialEvents:[]};',
              'M3 diag')
          s=rep(s,'for(const src of previousM3){','for(const src of previous15){','M3 loop')
          s=rep(s,
              '  const normalM1=rawM1.filter(r=>!packSourceIds.has(r.sourceId));\n  const normalM3=rawM3.filter(r=>!packSourceIds.has(r.sourceId));\n  const m3CollapseCounts={};\n  for(const r of rawM3)m3CollapseCounts[r.triple]=(m3CollapseCounts[r.triple]||0)+1;\n  diag.m3CollapseCounts={...m3CollapseCounts};\n  const m1Forecast=uniq(normalM1.map(r=>r.triple));',
              '  const normalM1=rawM1.filter(r=>!packSourceIds.has(r.sourceId));\n  const normalM3=rawM3.filter(r=>!packSourceIds.has(r.sourceId));\n  const m1Forecast=uniq(normalM1.map(r=>r.triple));',
              'M3 counts')
          s=rep(s,
              'newM3.push({triple:r.triple,stage:1,sourceId:r.sourceId,sourceCode:r.sourceCode,bornCode:fact,bornAt:current.id,collapseCount:Number(m3CollapseCounts[r.triple]||0),window:M3_WINDOW});',
              'newM3.push({triple:r.triple,stage:1,sourceId:r.sourceId,sourceCode:r.sourceCode,bornCode:fact,bornAt:current.id});',
              'M3 metadata')
          p.write_text(s,encoding='utf-8')

          p=Path('analyzer/app.js'); s=p.read_text(encoding='utf-8')
          s=rep(s,"const VER='0.7.0'","const VER='0.7.1'",'app version')
          s=rep(s,
              '  const m3=uniq((snap.m3||[]).map(x=>x.triple));\n  const m3Details=[...new Map([...(snap.m3||[])].filter(x=>x?.triple).sort((a,b)=>Number(a.bornAt||0)-Number(b.bornAt||0)).map(x=>[x.triple,{triple:x.triple,collapses:Number(x.collapseCount||0),window:Number(x.window||1000),stage:Number(x.stage||0),bornAt:Number(x.bornAt||0)}])).values()].sort((a,b)=>Number(a.triple[0])-Number(b.triple[0]));\n  const m3CollapseCounts=Object.fromEntries(m3Details.map(x=>[x.triple,x.collapses]));\n  const serial=uniq((snap.serialLeaders||[]).map(x=>x.triple));',
              '  const m3=uniq((snap.m3||[]).map(x=>x.triple));\n  const serial=uniq((snap.serialLeaders||[]).map(x=>x.triple));',
              'M3 details')
          s=rep(s,
              'M1:uniq(snap.m1||[]),M2_ready:m2,M3:m3,M3_details:m3Details,M3_COLLAPSES:m3CollapseCounts,serial_leader:serial,',
              'M1:uniq(snap.m1||[]),M2_ready:m2,M3:m3,serial_leader:serial,',
              'forecast M3 fields')
          s=rep(s,
              "  [['#m1Card',f.M1],['#m2Card',f.M2_ready],['#m4Card',f.M4_leaders],['#m6Card',f.M6_REPEAT_FAMILY_150]].forEach(([id,v])=>$(id).textContent=sig(v));const m3Details=Array.isArray(f.M3_details)?f.M3_details:[];$('#m3Card').textContent=m3Details.length?m3Details.map(x=>`${x.triple} (${Number(x.collapses||0)} раз)`).join(' / '):sig(f.M3);$('#m5Card').textContent=m5.signal?'🚨 СИГНАЛ':'NO SIGNAL';",
              "  [['#m1Card',f.M1],['#m2Card',f.M2_ready],['#m3Card',f.M3],['#m4Card',f.M4_leaders],['#m6Card',f.M6_REPEAT_FAMILY_150]].forEach(([id,v])=>$(id).textContent=sig(v));$('#m5Card').textContent=m5.signal?'🚨 СИГНАЛ':'NO SIGNAL';",
              'M3 display')
          p.write_text(s,encoding='utf-8')

          p=Path('analyzer/index.html'); s=p.read_text(encoding='utf-8')
          s=rep(s,'<div class="version" id="version">v0.7.0</div>','<div class="version" id="version">v0.7.1</div>','HTML version')
          s=rep(s,'<div class="method"><span>M3 · 1000 фактов · схлопывания</span><b id="m3Card">—</b></div>','<div class="method"><span>M3 · 15 фактов</span><b id="m3Card">—</b></div>','M3 label')
          s=rep(s,
              '<div><b>M1/M3</b><p>Exact-order XXX блокирует пару; иначе перестановки. M1 через mirror-history gate. M3 проверяет предыдущие 1000 тиражей; рядом с каждой прогнозируемой тройней показывается, сколько раз она схлопнулась в этом окне.</p></div>',
              '<div><b>M1/M3</b><p>Exact-order XXX блокирует пару; иначе перестановки. M1 через mirror-history gate, M3 — предыдущие15.</p></div>',
              'M3 rules')
          s=rep(s,'<script type="module" src="app.js?v=070-m3-1000-counts"></script>','<script type="module" src="app.js?v=071-m3-restored15"></script>','app cache bust')
          p.write_text(s,encoding='utf-8')

          p=Path('analyzer/sw.js'); s=p.read_text(encoding='utf-8')
          s=rep(s,"const CACHE='top3-analyzer-v0.7.0-m3-1000-counts';","const CACHE='top3-analyzer-v0.7.1-m3-restored15';",'SW cache')
          s=rep(s,"'./app.js?v=070-m3-1000-counts',","'./app.js?v=071-m3-restored15',",'SW app')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate restored M3
        shell: bash
        run: |
          node --check js/engine/triples-yulia.js
          node --check analyzer/app.js
          node --check analyzer/sw.js
          grep -q 'previous15=older.slice(-15)' js/engine/triples-yulia.js
          grep -q 'for(const src of previous15)' js/engine/triples-yulia.js
          grep -q 'M3 · 15 фактов' analyzer/index.html
          if grep -q 'M3_WINDOW\|m3CollapseCounts\|M3_details\|M3_COLLAPSES' js/engine/triples-yulia.js analyzer/app.js; then
            echo 'Residual M3-1000 code found'
            exit 1
          fi

      - name: Commit restored M3 and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-m3-window-1000-counts.yml
          git add -A
          git commit -m "Restore M3 original 15-draw behavior"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
