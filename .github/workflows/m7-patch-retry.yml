name: Analyzer M7 patch retry

on:
  push:
    paths:
      - '.github/workflows/m7-patch-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M7 patch
        run: python3 scripts/patch_analyzer_m7.py
      - name: Check M7 JavaScript
        run: node --check analyzer/m7.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analyzer/index.html analyzer/app.js analyzer/sw.js
          if git diff --cached --quiet; then
            echo 'No patch changes needed'
            exit 0
          fi
          git commit -m 'feat: wire strict M7 odd triples 500 into Analyzer'
          git pull --rebase origin main
          git push origin HEAD:main
