name: M6 window 1000 v0.6.7 retry

on:
  push:
    paths:
      - '.github/workflows/m6-window-1000-v067-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Expand M6 window to 1000 everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s: p.write_text(n,encoding='utf-8'); print('updated',path)
              else: print('already/no change',path)

          rw('js/engine/m6-v3-strict.js', lambda s: s.replace('TOP3-M6-REPEAT-FAMILY-150-V3-STRICT-20.09.2026','TOP3-M6-REPEAT-FAMILY-1000-V3-STRICT-23.09.2026').replace('export const M6_V3_WINDOW=150;','export const M6_V3_WINDOW=1000;'))

          def ae(s):
              s=s.replace("const window=facts.slice(-150), f=family(current.combo);","const window=facts.slice(-1000), f=family(current.combo);")
              s=s.replace("return {version:'V3',window:150,", "return {version:'V3',window:1000,")
              s=s.replace('const window=facts.slice(-150);','const window=facts.slice(-1000);').replace('idx-149','idx-999').replace('window:150','window:1000')
              if 'M6_REPEAT_FAMILY_1000:m6.signal' not in s:
                  s=s.replace('M6_REPEAT_FAMILY_150:m6.signal','M6_REPEAT_FAMILY_1000:m6.signal,M6_REPEAT_FAMILY_150:m6.signal')
              return s
          rw('analyzer/engine.js',ae)

          def aa(s):
              s=s.replace("const VER='0.6.6'","const VER='0.6.7'")
              if 'M6_REPEAT_FAMILY_1000:m6sig' not in s:
                  s=s.replace('M6_REPEAT_FAMILY_150:m6sig','M6_REPEAT_FAMILY_1000:m6sig,M6_REPEAT_FAMILY_150:m6sig')
              s=s.replace('/150','/1000').replace('окне150','окне1000').replace('окно150','окно1000')
              return s
          rw('analyzer/app.js',aa)

          def ah(s):
              return re.sub(r'app\.js\?v=[^\"]+','app.js?v=067-m6-1000',s.replace('family150','family1000').replace('150 тиражей','1000 тиражей').replace('последние 150','последние 1000').replace('/150','/1000').replace('окне150','окне1000').replace('Окно150','Окно1000'))
          rw('analyzer/index.html',ah)

          def tp(s):
              return s.replace('function repeatFamilies150(ctx,limit=150)','function repeatFamilies150(ctx,limit=1000)').replace('/150','/1000').replace('ПОСЛЕДНИЕ 150 ТИРАЖЕЙ','ПОСЛЕДНИЕ 1000 ТИРАЖЕЙ').replace('ПОСЛЕДНИЕ 150','ПОСЛЕДНИЕ 1000').replace('окно150','окно1000').replace('окне150','окне1000').replace('FAMILY / 150','FAMILY / 1000')
          rw('js/pages/triples.js',tp)

          def sw(s):
              s=re.sub(r"const CACHE='[^']+';","const CACHE='top3-analyzer-v0.6.7-m6-1000';",s)
              s=re.sub(r"\.\/app\.js\?v=[^']+","./app.js?v=067-m6-1000",s)
              if "'./engine.js?v=067-m6-1000'," not in s:
                  s=s.replace("'./engine.js',","'./engine.js?v=067-m6-1000',")
              return s.replace('063-archive-poll','067-m6-1000')
          rw('analyzer/sw.js',sw)

          p=Path('data/version.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d.update(version='1.3.21',buildDate='2026-09-23',note='M6 V3 STRICT: окно повторных семей и сложение family+family увеличены с 150 до 1000 тиражей; Yulia и Analyzer используют одно правило.')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rw('js/app.js',lambda s:re.sub(r'sw\.js\?v=[0-9.]+','sw.js?v=1.3.21',s))
          PY
      - name: Verify and syntax check
        run: |
          node --check js/engine/m6-v3-strict.js
          node --check js/pages/triples.js
          node --check analyzer/engine.js
          node --check analyzer/app.js
          node --check js/app.js
          grep -q 'M6_V3_WINDOW=1000' js/engine/m6-v3-strict.js
          grep -q 'limit=1000' js/pages/triples.js
          grep -q "VER='0.6.7'" analyzer/app.js
          grep -q 'slice(-1000)' analyzer/engine.js
      - name: Commit and push with rebase retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/engine/m6-v3-strict.js js/pages/triples.js analyzer/engine.js analyzer/app.js analyzer/index.html analyzer/sw.js data/version.json js/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: expand M6 repeat-family window to 1000 draws'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push origin main; then exit 0; fi
            sleep 4
          done
          exit 1
