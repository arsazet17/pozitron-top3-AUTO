name: Apply M6 V3 strict

on:
  push:
    paths:
      - 'js/engine/m6-v3-strict.js'
      - 'patch-m6-v3-strict.py'
      - '.github/workflows/apply-m6-v3-strict.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M6 V3 strict patch
        run: python3 patch-m6-v3-strict.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/triples.js js/engine/m6-v3-strict.js data/version.json package.json manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 v1.3.13: enable M6 V3 strict third+ repeat family"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
