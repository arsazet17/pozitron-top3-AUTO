name: Apply M6 V3 strict

on:
  push:
    paths:
      - 'js/engine/m6-v3-strict.js'
      - '.github/workflows/apply-m6-v3-strict.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire M6 V3 strict into triples page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          ver='1.3.13'
          p=Path('js/pages/triples.js')
          s=p.read_text(encoding='utf-8')
          imp='import {computeM6V3Strict,M6_V3_RULE_CODE} from "../engine/m6-v3-strict.js";\n'
          if 'm6-v3-strict.js' not in s:
              anchor='import {computeTripleBeacon,TRIPLE_BEACON_RULE_CODE} from "../engine/triple-beacon.js";\n'
              if anchor not in s: raise SystemExit('import marker not found')
              s=s.replace(anchor,anchor+imp,1)
          if 'function m6V3Html' not in s:
              marker='function tripleStats(ctx){'
              helper=r'''function m6V3Html(x){
 const r=x?.current;if(!r)return `<p class="muted">M6 V3 forward начнётся с факта №268327 → target №268328.</p>`;
 const paths=r.paths?.length?r.paths.join(" · "):"—";
 const rows=(x.rows||[]).slice(-20).reverse().map(q=>`<tr><td>№${esc(q.sourceId)}</td><td>${esc(q.date)}<br><b>${esc(q.time)}</b></td><td><b>${esc(q.fact)}</b><br>family${esc(q.family)}</td><td>${esc(q.count)}</td><td>${esc(q.appearances.map((id,i)=>`${i+1}:№${id}`).join(" · "))}</td><td>${q.trigger?"ДА":"НЕТ"}</td><td><b>${esc(q.triples?.length?q.triples.join(" / "):"—")}</b><br>→ №${esc(q.targetId)}</td><td>${esc(q.prevCheck)}</td></tr>`).join("");
 return `<div class="kpi" style="font-size:26px">${esc(r.triples?.length?r.triples.join(" / "):"— NO SIGNAL")}</div><div class="muted">one-shot на №${esc(r.targetId)} · current family${esc(r.family)} · N=${esc(r.count)} в окне ${esc(r.windowSize)}/150 · ${r.trigger?"TRIGGER":"NO TRIGGER"}</div><p><b>Появления:</b> ${esc(r.appearances.map((id,i)=>`${i+1}-е №${id}`).join(" · "))}</p><p><b>XXX:</b> ${esc(r.triples?.length?r.triples.join(" / "):"—")} · <b>пути:</b> ${esc(paths)}</p><div class="table-wrap"><table><thead><tr><th>№ факт</th><th>Дата / время</th><th>Факт / family</th><th>N</th><th>Появления</th><th>Trigger</th><th>M6 Frozen</th><th>Проверка предыдущего</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">Только current_family + current_family через все уникальные перестановки mod10; сохраняются только XXX. 1-е и 2-е появление = NO SIGNAL; 3-е и каждое последующее в текущем скользящем окне150 = trigger. V1/V2 не используются. M6 считается отдельно и не входит в CORE/M4. Код: ${esc(M6_V3_RULE_CODE)}.</p>`;
}
'''
              if marker not in s: raise SystemExit('helper marker not found')
              s=s.replace(marker,helper+marker,1)
          old='const calc=computeTripleChat(ctx.records,ctx.fullArchive),s=calc.snapshot,allLinks=computeTripleAllLinks(ctx.records),beacon=computeTripleBeacon(ctx.fullArchive);'
          new='const calc=computeTripleChat(ctx.records,ctx.fullArchive),s=calc.snapshot,allLinks=computeTripleAllLinks(ctx.records),beacon=computeTripleBeacon(ctx.fullArchive),m6=computeM6V3Strict(ctx);'
          if old in s:s=s.replace(old,new,1)
          elif 'm6=computeM6V3Strict(ctx)' not in s: raise SystemExit('render calc marker not found')
          card=' ${card("🧬 M6 · THIRD+ REPEAT FAMILY / 150 · V3 STRICT",m6V3Html(m6))}\n'
          anchor=' ${card("🔁 ПОВТОРНЫЕ СЕМЬИ · ПОСЛЕДНИЕ 150 ТИРАЖЕЙ",repeatFamilies150Html(repeats150))}\n'
          if card.strip() not in s:
              if anchor not in s: raise SystemExit('card marker not found')
              s=s.replace(anchor,anchor+card,1)
          p.write_text(s,encoding='utf-8')

          p=Path('data/version.json')
          d=json.loads(p.read_text(encoding='utf-8') or '{}');d['version']=ver;d['buildDate']='2026-09-20';d['note']='Тройни: M6 V3 STRICT — third+ current repeat family в скользящем окне150; V1/V2 отключены'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('package.json');d=json.loads(p.read_text(encoding='utf-8'));d['version']=ver;p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('manifest.webmanifest');s=p.read_text(encoding='utf-8');s=re.sub(r'"start_url":\s*"[^"]+"',f'"start_url": "./?v={ver}"',s,count=1);p.write_text(s,encoding='utf-8')

          p=Path('sw.js');s=p.read_text(encoding='utf-8');s=re.sub(r'const CACHE="[^"]+";',f'const CACHE="top3-auto-v1313-m6-v3-strict";',s,count=1)
          if './js/engine/m6-v3-strict.js' not in s:s=s.replace('"./js/engine/triple-beacon.js",','"./js/engine/triple-beacon.js","./js/engine/m6-v3-strict.js",')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pages/triples.js js/engine/m6-v3-strict.js data/version.json package.json manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 v1.3.13: enable M6 V3 strict third+ repeat family"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
