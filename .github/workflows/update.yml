name: TOP-3 AUTO · Stoloto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/top3_stoloto_api.mjs"
      - "scripts/update.mjs"
      - ".github/workflows/update.yml"
      - "top3-sync.trigger"

permissions:
  contents: write

concurrency:
  group: top3-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read verified TOP-3 tail from official Stoloto API
        run: |
          set -u
          success=0
          for attempt in 1 2 3; do
            echo "TOP-3 official API attempt $attempt/3"
            if node scripts/top3_stoloto_api.mjs; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "API retry in 8 sec..."
              sleep 8
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::TOP-3 official API reader failed after 3 attempts."
            exit 1
          fi

      - name: Settle missed draws and build next frozen
        run: node scripts/update.mjs

      - name: Commit changed TOP-3 data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data
          git commit -m "TOP-3 AUTO · official Stoloto API sync"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
