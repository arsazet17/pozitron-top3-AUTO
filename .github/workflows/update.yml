name: TOP-3 AUTO · Stoloto

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top3-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read latest TOP-3 draw from Stoloto
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            echo "TOP-3 Stoloto attempt $attempt/6"
            if node scripts/update.mjs; then
              break
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Fresh draw not available yet; retry in 25 sec."
              sleep 25
            fi
          done

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data/archive.json data/latest.json)" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/archive.json data/latest.json
          git commit -m "TOP-3 AUTO · Stoloto update"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
