name: TOP-3 AUTO · Stoloto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: top3-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser reader
        run: |
          npm install --no-save playwright@1.54.0
          npx playwright install --with-deps chromium

      - name: Read, catch up, settle and forecast TOP-3
        run: |
          set -u
          success=0

          for attempt in 1 2 3; do
            echo "TOP-3 Stoloto browser attempt $attempt/3"

            if node scripts/update.mjs; then
              success=1
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retry in 25 sec..."
              sleep 25
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::TOP-3 could not synchronize after 3 browser attempts."
            exit 1
          fi

      - name: Commit changed data immediately
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data
          git commit -m "TOP-3 AUTO · full forecast/state update"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
