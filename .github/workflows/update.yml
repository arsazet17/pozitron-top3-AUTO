name: TOP-3 AUTO · Stoloto

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: top3-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TOP-3 lightweight sync
        run: |
          set -u
          success=0
          for attempt in 1 2 3; do
            echo "TOP-3 API attempt $attempt/3"
            if node scripts/update.mjs; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::TOP-3 lightweight API sync failed."
            exit 1
          fi

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data
          git commit -m "TOP-3 AUTO · full forecast/state update"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
