name: Install TOP3 AUTO Forecast Center
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node install-top3-auto-forecast-center.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js scripts/update.mjs forecast-center.js forecast-center.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TOP3 AUTO forecast center + future fact guard"
          git push
